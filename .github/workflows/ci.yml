name: CI/CD Pipeline

on:
  pull_request:
    branches: [staging]
  push:
    branches: [main, staging]

jobs:
  # ── Job 1 : Tests ────────────────────────────────────────────────────────────
  test:
    name: Tests (lint, prettier, ts, unit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: DATABASE_URL="postgresql://user:pass@localhost:5432/db" npx prisma generate

      - name: Check TypeScript
        run: npm run ts

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Unit tests
        run: npm test

  # ── Job 2 : Docker build + push ──────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          TAG="${BRANCH}-${{ github.sha }}"
          echo "image_tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            soji27/ci-cd-api:latest
            soji27/ci-cd-api:${{ steps.meta.outputs.image_tag }}

  # ── Job 3 : Deploy to Render ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  # ── Job 4 : K6 performance tests ─────────────────────────────────────────────
  performance:
    name: K6 Performance Tests
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Render deploy to start
        run: sleep 60

      - name: Wait for service to be ready
        run: |
          for i in {1..20}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cicd-api-m1ak.onrender.com/health || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Service is UP!"
              break
            fi
            echo "Attempt $i: not ready yet (status: $HTTP_STATUS)..."
            sleep 15
          done

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/load-test.js
        env:
          TARGET_URL: https://cicd-api-m1ak.onrender.com
