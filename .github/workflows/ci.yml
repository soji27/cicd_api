name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: DATABASE_URL="postgresql://user:pass@localhost:5432/db" npx prisma generate

      - name: Check TypeScript
        run: npm run ts

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            aissaninadia/ci-cd-api:latest
            aissaninadia/ci-cd-api:${{ github.sha }}

      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

  performance-test:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Render deploy to start
        run: sleep 60

      - name: Wait for service to be ready
        run: |
          for i in {1..20}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cicd-api-m1ak.onrender.com/health || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Service is UP!"
              break
            fi
            echo "Attempt $i: not ready yet (status: $HTTP_STATUS)..."
            sleep 15
          done

      - name: Run k6 Load Test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/load-test.js
        env:
          TARGET_URL: https://cicd-api-m1ak.onrender.com
